<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffd5"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>
  <!-- Master icon for NEON OPHIS. Source-of-truth for all PWA / favicon
       output (see scripts/build-assets.sh). Same neon S-curve as the inline
       favicon in index.html, scaled 8x (viewBox 64 -> 512). No SVG filters:
